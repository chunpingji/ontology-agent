services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slpra
      POSTGRES_USER: slpra
      POSTGRES_PASSWORD: slpra_dev
    ports:
      - "${DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ontology-agent-backend:cuda12-2.7.1
    runtime: nvidia
    build:
      context: ./backend
      dockerfile: Dockerfile.cuda12
    # 开发期间关闭 --reload，避免 WatchFiles 在长时间 LLM 后台任务期间 kill 进程
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://slpra:slpra_dev@db:5432/slpra
      ONTOLOGY_DIR: /app/ontology/slpra
      OWL_STORE_PATH: /app/data/slpra.sqlite3
      # LLM extraction key — injected from host env / .env, never baked into the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 012: 本地 LLM 补抽（gap filling）— 连接宿主机上的 Ollama / vLLM 端点。
      # 默认关；启用后通过 host.docker.internal 访问宿主机 LLM 服务。
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-true}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-Qwen3.6-35B-A3B}
      LOCAL_LLM_MODEL_REVISION: ${LOCAL_LLM_MODEL_REVISION:-}
      LOCAL_LLM_TOKENIZER_PATH: ${LOCAL_LLM_TOKENIZER_PATH:-}
      LOCAL_LLM_TOKENIZER_BACKEND: ${LOCAL_LLM_TOKENIZER_BACKEND:-file}
      LOCAL_LLM_SERVER_MODEL_PATH: ${LOCAL_LLM_SERVER_MODEL_PATH:-}
      EVIDENCE_MAX_TASKS: ${EVIDENCE_MAX_TASKS:-2048}
      EVIDENCE_MAX_INPUT_TOKENS: ${EVIDENCE_MAX_INPUT_TOKENS:-16384}
      EVIDENCE_MAX_OUTPUT_TOKENS: ${EVIDENCE_MAX_OUTPUT_TOKENS:-20480}
      EVIDENCE_MAX_REGIONS_PER_TASK: ${EVIDENCE_MAX_REGIONS_PER_TASK:-32}
      EVIDENCE_TIMEOUT_S: ${EVIDENCE_TIMEOUT_S:-600}
      EVIDENCE_TIMEOUT_RETRIES: ${EVIDENCE_TIMEOUT_RETRIES:-3}
      EVIDENCE_TOTAL_TIMEOUT_S: ${EVIDENCE_TOTAL_TIMEOUT_S:-600}
      LOCAL_LLM_TOTAL_TIMEOUT_S: ${LOCAL_LLM_TOTAL_TIMEOUT_S:-600}
      LOCAL_LLM_MAX_CONCURRENCY: ${LOCAL_LLM_MAX_CONCURRENCY:-2}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-not-needed}
      # 022: 默认 CUDA 12.6 召回与精排；CPU 使用 docker-compose.cpu.yml。
      # 显式选择一张物理卡；未配置时不暴露 GPU，启用后的探测会明确失败。
      NVIDIA_VISIBLE_DEVICES: ${SEMANTIC_RANKING_GPU_ID:-none}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # 制品路径使用容器内 /app/models；能力仍须显式开启并准备完整制品。
      SEMANTIC_RANKING_ENABLED: ${SEMANTIC_RANKING_ENABLED:-false}
      SEMANTIC_RANKING_BUDGET_ENABLED: ${SEMANTIC_RANKING_BUDGET_ENABLED:-true}
      SEMANTIC_RANKING_MODE: ${SEMANTIC_RANKING_MODE:-semantic}
      SEMANTIC_RANKING_FAILURE_POLICY: ${SEMANTIC_RANKING_FAILURE_POLICY:-pause}
      SEMANTIC_RANKING_EMBEDDING_PATH: ${SEMANTIC_RANKING_EMBEDDING_PATH:-}
      SEMANTIC_RANKING_EMBEDDING_MANIFEST_PATH: ${SEMANTIC_RANKING_EMBEDDING_MANIFEST_PATH:-}
      SEMANTIC_RANKING_RERANKER_PATH: ${SEMANTIC_RANKING_RERANKER_PATH:-}
      SEMANTIC_RANKING_RERANKER_MANIFEST_PATH: ${SEMANTIC_RANKING_RERANKER_MANIFEST_PATH:-}
      SEMANTIC_RANKING_DEVICE: ${SEMANTIC_RANKING_DEVICE:-cuda:0}
      SEMANTIC_RANKING_DTYPE: ${SEMANTIC_RANKING_DTYPE:-float16}
      SEMANTIC_RANKING_CUDA_VERSION: ${SEMANTIC_RANKING_CUDA_VERSION:-12.6}
      SEMANTIC_RANKING_POOL_SIZE: ${SEMANTIC_RANKING_POOL_SIZE:-64}
      SEMANTIC_RANKING_BATCH_SIZE: ${SEMANTIC_RANKING_BATCH_SIZE:-4}
      SEMANTIC_RANKING_MAX_TOKENS_PER_PAIR: ${SEMANTIC_RANKING_MAX_TOKENS_PER_PAIR:-4096}
      SEMANTIC_RANKING_MAX_TOKENS_PER_SLOT: ${SEMANTIC_RANKING_MAX_TOKENS_PER_SLOT:-524288}
      SEMANTIC_RANKING_MAX_TOKENS_PER_RUN: ${SEMANTIC_RANKING_MAX_TOKENS_PER_RUN:-4194304}
      SEMANTIC_RANKING_TIMEOUT_SECONDS: ${SEMANTIC_RANKING_TIMEOUT_SECONDS:-1200}
      SEMANTIC_RANKING_RETRY_LIMIT: ${SEMANTIC_RANKING_RETRY_LIMIT:-1}
      DOCUMENT_ANALYSIS_DISPATCH_CONCURRENCY: ${DOCUMENT_ANALYSIS_DISPATCH_CONCURRENCY:-1}
      # 新建运行冻结证据聚合、属性协议及证明菜单；旧运行保留原策略。
      DOCUMENT_ANALYSIS_EVIDENCE_REPAIR_ENABLED: ${DOCUMENT_ANALYSIS_EVIDENCE_REPAIR_ENABLED:-true}
      # Enhanced views/search by default; enforce additionally requires reviewed calibration.
      DOCUMENT_ANALYSIS_ADAPTIVE_RETRIEVAL_MODE: ${DOCUMENT_ANALYSIS_ADAPTIVE_RETRIEVAL_MODE:-enhanced}
      DOCUMENT_ANALYSIS_ADAPTIVE_CALIBRATION_PATH: ${DOCUMENT_ANALYSIS_ADAPTIVE_CALIBRATION_PATH:-}
      # 所有本地 CPU 模型共享的线程限制，避免小批次占满宿主核数。
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      # 输出 token 上限（OpenAI max_tokens → llama.cpp n_predict）。默认 200K；
      # 与上下文窗口无关——n_ctx 由 llama-server 启动的 --ctx-size 决定，此处只管输出。
      LOCAL_LLM_MAX_TOKENS: ${LOCAL_LLM_MAX_TOKENS:-200000}
      # air-gap：强制 huggingface_hub / transformers 全程离线，杜绝任何远程 repo
      # 解析或权重外发（配套代码内 local_files_only=True，008 Principle VI）。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # 认证层（API 访问控制）：默认开启，对 /api/* 强制校验登录令牌（放行 /api/health、
      # /api/auth/login）。设 false 可退回信任 X-User/X-Role 头的旧行为。AUTH_SECRET
      # 为令牌签名密钥，经宿主 env / .env 注入，绝不入库/入镜像；生产务必覆盖默认值。
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_SECRET: ${AUTH_SECRET:-dev-slpra-auth-secret-change-me}
    volumes:
      - ./backend/app:/app/app
      - ./ontology:/app/ontology
      # 本地模型权重（GLiNER + 中文嵌入器）不入镜像，经制品库交付到宿主
      # backend/models/，运行期挂载到 /app/models（gliner_model_path /
      # semantic_embedding_model 相对后端根解析至此）。缺权重则静默降级。
      - ./backend/models:/app/models
      - backend_data:/app/data
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No NEXT_PUBLIC_API_URL: the bundle uses same-origin relative "/api/..."
      # calls; the nginx edge proxy (web) routes them to the backend.
    # Not published to the host — reachable only through the nginx proxy.
    expose:
      - "3000"
    depends_on:
      - backend

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_HOST_PORT:-8081}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  backend_data:
